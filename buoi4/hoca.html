<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ho ca</title>
    <style>
        #hoca{position: fixed; bottom: 0; border: 2px double; height: 400px; width: 100%; border-top:0; background-color: azure;}
        @keyframes caboi {
            0%{}
            25%{translate:400px 200px;}
            48%{translate: 800px 200px;}
            52%{translate: 800px 200px; rotate: -10deg;}
            75%{translate: 400px 200px;}
        }
#ca{animation: caboi 30s infinite; height: 100px; transform: scaleX(-1);}
    </style>
</head>
<body>
    <h2>Thái Gia Tuệ - 52.01.104.105</h2>
    <div id="hoca">
<img id="ca" src="cá hen.jpg" alt="Cá heo"/>
    </div>
</body>
</html>
